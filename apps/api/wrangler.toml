name = "docs-nu-api"
main = "src/index.ts"
compatibility_date = "2026-05-29"
# better-auth (sign-in, docs/specs/014-identity/auth-and-guest-access.md) imports node:crypto and uses
# AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]

# Bundle the share card's fonts (packages/render-png/fonts, Inter Regular and Bold) as raw bytes for the resvg PNG
# renderer (docs/specs/013-workspace/share-link-previews.md): a Worker has no system fonts, so without this the card
# draws shapes but no text.
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]

# Plain (non-secret) vars. Everything here is every fork's default too, so
# what only docs.nu runs with is NOT here: TELEMETRY_ENABLED, the image
# gallery caps and APP_BASE_URL live in `hosted-vars.json`, which the deploy
# adds with `wrangler deploy --var` on docs.nu's own repository only, and
# then verifies on the live worker (docs/specs/016-platform/deployment.md
# "Hosted profile"). A fork is therefore telemetry-off and uncapped until it
# opts in, by declaring the var here. TELEMETRY_ENABLED gates the anonymous,
# first-party product analytics + the public /telemetry dashboard
# (docs/specs/017-telemetry/telemetry.md): "true" turns it on; anything else,
# or absent, keeps it fully off.
[vars]

# Origin allow-list for POST /api/ai (docs/specs/007-editor/ai-assistance.md). Stated HERE, not in the
# Cloudflare dashboard: a dashboard-only value is invisible to code review, so
# the repo could read as though this endpoint were locked down while it served
# any page.
#
# The apex alone: docs.nu is canonical and www.docs.nu 301-redirects to it, so
# the apex is the origin a real browser sends.
#
# Scope of the protection, honestly: this stops a third-party WEB PAGE spending
# the key, because a browser sets Origin and cannot forge it. It does NOT stop a
# non-browser caller, which can send any Origin it likes. Bounding the budget
# against that needs AI_REQUIRE_ACCOUNT (deliberately NOT set here: the editor
# offers AI to guests and /api/capabilities reports `aiEnabled` from the key's
# presence alone, so requiring sign-in would leave guests a visible panel that
# 401s — see the note in src/routes/capabilities.ts). AI_RATE_LIMITER (20/60s
# per IP) remains the only other control.
AI_ALLOWED_ORIGINS = "https://docs.nu"

# The CLI signs in through the MCP worker's OAuth server (docs/specs/015-api/cli.md "Authentication"); the
# api names it in /api/capabilities. CLI_MIN_VERSION (unset until a release needs a floor) refuses writes
# from an older CLI. Blank: docs.nu's MCP worker is not deployed yet.
OAUTH_ISSUER = ""

# Google Drive mirror (docs/specs/022-drive-mirror/drive-mirror.md). No binding
# of its own: it rides the D1 database above (drive_connections, drive_items).
#   - GOOGLE_CLIENT_ID: plain var, docs.nu's own OAuth client, so it lives in
#     `hosted-vars.json` (a fork has its own Google project and must not
#     inherit ours). The hosted build bakes the same id into the live app as
#     NEXT_PUBLIC_GOOGLE_CLIENT_ID (scripts/hosted-vars.mjs build-env), and
#     verify / verify-build prove the two agree on every deploy.
#   - GOOGLE_CLIENT_SECRET, DRIVE_TOKEN_KEY: secrets, set by hand exactly like
#     RESEND_API_KEY: `wrangler secret put GOOGLE_CLIENT_SECRET` and
#     `wrangler secret put DRIVE_TOKEN_KEY` (base64 of 32 random bytes).
# Without GOOGLE_CLIENT_ID every /api/drive route answers 503 and the live app
# shows no Drive entry, which is the self-host default.

# D1 database holding documents + participants. The local binding name
# (`DB`) is what `src/db.ts` reads via the Env type. The `database_name`
# is the Cloudflare-side name (created with `wrangler d1 create docs-nu`).
[[d1_databases]]
binding = "DB"
database_name = "docs-nu"
database_id = "33fca348-453a-4812-ac83-064f4d8c8a89"
migrations_dir = "migrations"

# R2 bucket holding the bytes of every uploaded image element
# (docs/specs/009-elements/images.md). The binding name `IMAGES` is what `src/index.ts` reads
# via the Env type. The bucket must be created out of band via
# `wrangler r2 bucket create docs-nu-images` or
# the dashboard. Leaving the binding absent locally puts the api
# in "no uploads" mode: the image endpoints return 503 and the
# editor's palette hides the Image entry. See docs/specs/009-elements/images.md + docs/specs/002-project-scope/open-source-and-business-model.md
# self-host promise.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "docs-nu-images"

# Per-owner rate limiter (Cloudflare Workers Rate Limiting API).
# Caps writes at 300 / 60s per owner: a generous ceiling for normal
# editing (autosave + comment posts + log appends) but well below
# what a malicious bot would push through. The api worker calls
# `env.WRITE_RATE_LIMITER.limit({ key })` at the top of every write
# endpoint; over-limit requests get a 429. Namespace ids are
# account-wide: two workers on one account with the same id share one
# counter, so docs.nu's run 7001-7012, clear of the other workers on its
# account. Self-host: when this binding is absent the rate-limit
# helper falls through to "allow" so deployments without the
# feature still work.
[[unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7001"
simple = { limit = 300, period = 60 }

# Per-IP limiter for the anonymous telemetry ingest (POST /api/events,
# docs/specs/017-telemetry/telemetry.md). Separate namespace from the write limiter so abuse of the
# public events endpoint can never eat into a user's document-write
# budget. 120 batches / 60s per IP is generous for a real editor
# session (which flushes a handful of batches a minute) while bounding
# how fast one source can flood D1 / inflate the public dashboard.
# Keyed on CF-Connecting-IP in src/index.ts. Absent binding → the
# helper allows, so self-host still works.
[[unsafe.bindings]]
name = "EVENTS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7002"
simple = { limit = 120, period = 60 }

# A document's room (docs/specs/006-document/document-storage.md): one SQLite-backed Durable Object per document
# id, holding its content and relaying its realtime traffic; clients connect via WebSocket through the
# `/api/documents/<id>/ws` endpoint.
[[durable_objects.bindings]]
name = "DOCUMENT_ROOM"
class_name = "DocumentRoom"

# The key-value room each document had before (docs/specs/006-document/document-storage-move.md): it hands its
# storage to the document's new room once, and goes with the release that drops D1's content tables.
[[durable_objects.bindings]]
name = "LEGACY_DOCUMENT_ROOM"
class_name = "LegacyDocumentRoom"

[[migrations]]
tag = "v1"
new_classes = ["DiagramRoom"]

# The class was DiagramRoom until the container became a document
# (docs/specs/006-document/document.md). A rename keeps every room's storage.
[[migrations]]
tag = "v2"
renamed_classes = [{ from = "DiagramRoom", to = "DocumentRoom" }]

# A class cannot change its storage backend, so the key-value rooms step aside under a new name, keeping their
# storage, and a SQLite-backed class takes the old one (docs/specs/006-document/blueprints/document-storage-move.md).
[[migrations]]
tag = "v3"
renamed_classes = [{ from = "DocumentRoom", to = "LegacyDocumentRoom" }]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DocumentRoom"]

# Scheduled jobs the worker handles via the `scheduled` export. One
# entry per cron; each fires the same handler with `event.cron` set
# to the matching pattern so the body can dispatch.
#
# `0 3 * * *`: daily at 03:00 UTC. Fires independent retention sweeps
# on this trigger, among them:
#   - events, 60-day floor (docs/specs/017-telemetry/telemetry.md "Retention"). The /telemetry
#     dashboard surfaces a 30-day max window, so anything past 60
#     days is dead storage.
#   - images, 30-day floor for UNUSED images only (docs/specs/009-elements/images.md): reaped
#     from R2 + D1 once nothing references them.
# Plus the docs/specs/014-identity/transactional-email.md email sweeps (lifecycle onboarding + token-expiry
# warnings), both no-ops when RESEND_API_KEY is unset.
#
# `* * * * *`: every minute, the content move sweep (docs/specs/006-document/document-storage-move.md "The sweep"):
# documents whose content is still in D1 move into their rooms; idle once every document has moved.
[triggers]
crons = ["0 3 * * *", "* * * * *"]

# Per-IP rate limiter for the AI assistance endpoint (POST /api/ai,
# docs/specs/007-editor/ai-assistance.md). Separate namespace so AI abuse never eats into document-write
# or telemetry budgets. 20 requests / 60s per IP is generous for a
# real user session while bounding runaway OpenAI spend. Absent binding
# → helper allows, so self-host still works without this feature.
[[unsafe.bindings]]
name = "AI_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7003"
simple = { limit = 20, period = 60 }

# Per-IP limiter for share-code resolution (GET /api/share/<code>): an unauthed read, exempt from the write
# limiter. 30 resolves / 60s per IP is ample for legit visitors. Separate namespace. Absent binding → the
# index.ts check is skipped, so self-host still works.
[[unsafe.bindings]]
name = "SHARE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7004"
simple = { limit = 30, period = 60 }

# Share-password guesses (docs/specs/013-workspace/share-password.md "Guessing is limited"): every check the
# verified cache cannot answer, on any share-code door, counts against the caller's network (share-pw:<network>,
# an IPv4 address or IPv6 /64) and against the document from any network (share-pw-doc:<documentId>), so a
# guesser can't spread tries across addresses either. Over either: 429 rate_limited, Retry-After 60
# (SHARE_GUESS_RETRY_AFTER_S). A visitor already in spends nothing. Absent bindings → allow (self-host).
[[unsafe.bindings]]
name = "SHARE_GUESS_VISITOR_LIMITER"
type = "ratelimit"
namespace_id = "7016"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "SHARE_GUESS_ITEM_LIMITER"
type = "ratelimit"
namespace_id = "7017"
simple = { limit = 30, period = 60 }

# Per-IP throttle for GET /api/unfurl (docs/specs/009-elements/link-cards.md): an unauthenticated outbound
# page fetch for link-card previews. 60/60s is plenty for a user dropping
# bookmark cards. Separate namespace. Absent binding → check skipped (self-host).
[[unsafe.bindings]]
name = "UNFURL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7005"
simple = { limit = 60, period = 60 }

# Per-token read throttle for token-authed GETs (docs/specs/015-api/public-api-and-tokens.md §3.5): an external
# integration's reads, keyed on the token id, so one runaway script can't hammer
# reads independently of the owner's app use. Token WRITES ride
# WRITE_RATE_LIMITER (also keyed on the token id). Absent binding → allow.
[[unsafe.bindings]]
name = "API_TOKEN_READ_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7006"
simple = { limit = 120, period = 60 }

# Per-owner limiter for POST /api/drive/token (docs/specs/022-drive-mirror/drive-mirror.md,
# "Tokens"): each call reaches Google's token endpoint to mint a one-hour access
# token, so a healthy browser needs about one an hour. 10 / 60s per account
# id bounds a looping client far below the general write limiter's 300. The
# route answers 429 drive_token_rate_limited, which the browser treats like
# Google's own rate limit (it backs off). Absent binding → allow (self-host).
[[unsafe.bindings]]
name = "DRIVE_TOKEN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7007"
simple = { limit = 10, period = 60 }

# Per-person limiter for content search (GET /api/search/content, docs/specs/013-workspace/content-search.md): a
# search runs as typing pauses, so 120 / 60s is a person typing fast for a minute. Absent binding → allow (self-host).
[[unsafe.bindings]]
name = "SEARCH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7015"
simple = { limit = 120, period = 60 }

# Per-owner limiter for Explorer Home's reads (GET /api/home and /api/home/timeline,
# docs/specs/013-workspace/explorer-home.md): one read answers a whole screen, and a healthy client
# reads on mount, on return to the tab and after its own writes, a handful a minute. 60 / 60s bounds a
# looping client. Separate namespace. Absent binding → allow (self-host).
[[unsafe.bindings]]
name = "HOME_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7008"
simple = { limit = 60, period = 60 }

# Per-token limiter for workbench ticket mints and pairing requests (docs/specs/013-workspace/workbench-embeds.md,
# WORKBENCH_TICKETS_PER_MINUTE), keyed workbench-ticket:<token id>. A workbench opens a few documents, never a stream.
# Separate namespace. Absent binding → allow (self-host).
[[unsafe.bindings]]
name = "WORKBENCH_TICKET_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7010"
simple = { limit = 30, period = 60 }

# Per-network limiter for a form link's reads and responses (docs/specs/030-forms/forms.md "Abuse and limits"),
# keyed form:<network> and form-read:<network> (an IPv4 /24 or IPv6 /56, client-ip.ts clientNetwork). Respondents are anonymous,
# so the owner-keyed write limiter would put them all on one key. 60 / 60s lets a classroom behind one address
# answer together. Separate namespace. Absent binding → allow (self-host).
[[unsafe.bindings]]
name = "FORM_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7011"
simple = { limit = 60, period = 60 }

# Per-network limiter for an invite email's Decline link (docs/specs/013-workspace/teams.md "Declining from the
# email"): GET and POST /api/teams/invite-decline/<token>, keyed invite-decline:<network> (an IPv4 /24 or IPv6 /56).
# Open doors, so the owner-keyed write limiter would put every caller on one key. 20 / 60s is far above one
# person declining. Separate namespace. Absent binding → allow (self-host).
[[unsafe.bindings]]
name = "TEAM_INVITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7012"
simple = { limit = 20, period = 60 }

# Sign-in (docs/specs/014-identity/blueprints/auth-and-guest-access.md "Security and trust"): every POST under
# /api/auth, keyed on CF-Connecting-IP, and each sign-in code send, keyed on a hash of the address. better-auth's
# own limiter stays off (it would keep IP keys in D1). Absent bindings → allow (self-host).
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7013"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "AUTH_EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "7014"
simple = { limit = 3, period = 60 }

# Cloudflare Email Service (docs/specs/014-identity/transactional-email.md): the preferred email transport. Sending
# needs the From domain onboarded under Email Service > Email Sending; a self-host without it removes this block
# and sets RESEND_API_KEY instead, or runs without email. Previews drop it and keep mail in an outbox.
[[send_email]]
name = "EMAIL"

# The AI features (docs/specs/007-editor/ai-assistance.md) talk to ANY OpenAI-compatible chat-completions
# endpoint, and WHICH provider is inferred from which key is set — a key is
# provider-specific, so its name says whose it is (see src/ai-provider.ts):
#
#   GOOGLE_AI_STUDIO_API_KEY -> Google, at its OpenAI-compatible endpoint
#   OPENAI_API_KEY           -> OpenAI
#   AI_API_KEY               -> anything else, with AI_BASE_URL + AI_MODEL
#
# All three are SECRETS, provisioned out-of-band:
#   Local dev: drop one into `apps/api/.dev.vars` (gitignored).
#   Production: `wrangler secret put <NAME>`.
#
# Each feature takes its own provider from the keys that are set: the assistant
# (/api/ai) prefers OpenAI, the crop reader (/api/ai/read-notes) prefers Google,
# and one key serves both. Production sets both named keys to split them.
# AI_BASE_URL / AI_MODEL / AI_VISION_MODEL are plain [vars]; AI_MODEL is the
# assistant's model and AI_VISION_MODEL the reader's (docs/specs/007-editor/ai-assistance.md).
#
# With no key the whole surface is hidden: GET /api/capabilities answers
# { aiEnabled: false }, the editor shows no AI panel and no photo import, and
# the AI routes answer 503. That is the self-host default.

# Per-owner soft caps on the image gallery (docs/specs/009-elements/images.md). Both default to
# "no limit" so OSS self-host operators run their own storage budget;
# hosted docs.nu sets both, through `hosted-vars.json` (see the top of
# this file), so a single owner can't drain the R2 bucket. POST /api/images
# returns 403 { error: "gallery_full" } once either cap is reached:
#
#   - IMAGE_MAX_PER_OWNER: maximum number of image rows one owner
#     may keep in the gallery. Hosted: "100".
#   - IMAGE_MAX_BYTES_PER_OWNER: maximum total byte_size summed
#     across one owner's images. Hosted: "104857600" (100 MB).
#
# Plain vars; values are decimal strings parsed via parseInt at request time.
# Unset, blank, "0", or non-numeric values all read as "no limit". A self-host
# sets them in [vars] above, never only in the Cloudflare dashboard: every
# `wrangler deploy` replaces the worker's plain vars with the ones it declares.

# Email (docs/specs/014-identity/transactional-email.md): the EMAIL binding above, else RESEND_API_KEY (a worker
# secret; locally `RESEND_API_KEY=re_...` in `apps/api/.dev.vars`), else none and email is inert. EMAIL_FROM is
# an optional [vars] From identity (default "LiveDoc <hello@docs.nu>"). APP_BASE_URL is the public origin for
# links in emails and sign-in's base URL; production sets it in hosted-vars.json.
#
# Sign-in (docs/specs/014-identity/auth-and-guest-access.md) is off until BETTER_AUTH_SECRET is set:
# `openssl rand -base64 32 | wrangler secret put BETTER_AUTH_SECRET`. Google sign-in adds GOOGLE_AUTH_CLIENT_ID
# ([vars] or hosted-vars.json) and the secret GOOGLE_AUTH_CLIENT_SECRET.

# Guest ids are signed with a key derived from BETTER_AUTH_SECRET (src/auth/guest-key.ts), so a host with
# sign-in on signs and requires guest signatures, and a guest-only host signs nothing. No separate secret.
# Rotating the sign-in secret through BETTER_AUTH_SECRETS keeps BETTER_AUTH_SECRET in place, and the guest key
# with it; removing the secret the key derives from re-keys every guest.

# INTERNAL_EVENTS_KEY marks a POST to /api/events as coming from one of our
# OWN workers over a service binding, rather than from the open internet
# (docs/specs/017-telemetry/telemetry.md, issue #36). Provisioned out-of-band; never in
# [vars] — it is secret material:
#
#   - Local dev: `INTERNAL_EVENTS_KEY=...` in `apps/api/.dev.vars`
#     (gitignored). Rarely needed — local dev doesn't run the MCP worker
#     over a service binding.
#   - Production: `wrangler secret put INTERNAL_EVENTS_KEY`, and the SAME
#     value on the mcp worker (`wrangler secret put INTERNAL_EVENTS_KEY`
#     from apps/mcp). Generate with `openssl rand -hex 32`.
#
# Why it exists: a service-binding call carries no CF-Connecting-IP, so
# `clientIp` fell back to the literal 'anonymous' and every internal caller
# in the world shared ONE 120/min EVENTS_RATE_LIMITER key, with the overflow
# dropped as a 204 the caller can't distinguish from success. Since the mcp
# worker posts one request per tool call, that ceiling was roughly two tool
# calls per second globally. A matching key exempts those calls from the
# per-IP limiter, which exists to stop ANONYMOUS abuse of a public endpoint
# and was never aimed at us.
#
# Unset on either side = nobody is exempt, which is the pre-existing
# behaviour and needs no configuration, so a self-host can ignore this.
# The two sides MUST match: a mismatch is silent (the caller simply lands
# back in the shared bucket), so check `wrangler secret list` on both if
# Mcp·Used counts look flat.
