name = "docs-nu-router"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# The public hostnames. docs.nu is canonical; www.docs.nu is attached too so the
# zone's redirect rule has a proxied host to send to the apex (docs/operations/docs-nu.md).
routes = [
  { pattern = "docs.nu", custom_domain = true },
  { pattern = "www.docs.nu", custom_domain = true },
]

# Service bindings to the five downstream apps. Each `service` must match the
# deployed Worker name of that app. See docs/specs/016-platform/router-app.md.

[[services]]
binding = "MARKETING"
service = "docs-nu-marketing"

[[services]]
binding = "LIVE"
service = "docs-nu-live"

[[services]]
binding = "API"
service = "docs-nu-api"

[[services]]
binding = "TELEMETRY"
service = "docs-nu-telemetry"

[[services]]
binding = "HELP"
service = "docs-nu-help"

# Local dev (`wrangler dev --env local --port 4000`, the workspace `dev`
# script): service bindings can't reach the local Next dev servers, so this
# environment defines none and sets plain HTTP origins instead. The worker
# falls back to proxying these when a binding is absent. See docs/specs/016-platform/router-app.md.
[env.local.vars]
# Tells the router it fronts `next dev`, whose chunks are not content-hashed, so their own
# no-cache header passes through (docs/specs/016-platform/stale-builds.md "Caching rules").
DEPLOY_ENV = "local"
MARKETING_ORIGIN = "http://127.0.0.1:4001"
LIVE_ORIGIN = "http://127.0.0.1:4002"
API_ORIGIN = "http://127.0.0.1:8787"
TELEMETRY_ORIGIN = "http://127.0.0.1:4003"
HELP_ORIGIN = "http://127.0.0.1:4004"
