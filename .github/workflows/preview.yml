name: Preview

# One complete, isolated copy of docs.nu per pull request, at
# https://<branch>.preview.docs.nu (docs/specs/016-platform/preview-deployments.md). Deployed on every push to the
# pull request, deleted when it closes. Pull requests from forks get none: they
# run without this repository's secrets, and a preview would deploy their code
# with our Cloudflare token.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# One run per pull request at a time. A newer push, or the close, supersedes an
# unfinished deploy: the preview is rebuilt or deleted either way.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The help centre dates its articles from history (apps/help/lib/article-dates.ts).
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        env:
          # The api's BUILD_ID is set to the same value (docs/specs/016-platform/stale-builds.md).
          NEXT_PUBLIC_BUILD_ID: ${{ github.event.pull_request.head.sha }}
        run: pnpm build

      - name: Deploy the preview
        id: deploy
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.event.pull_request.head.sha }}
          # Through the environment, never inline: a branch name is text anyone with push access chooses.
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          node scripts/preview.mjs deploy "$PR" "$BRANCH" | tee preview.log
          url="$(sed -n 's/^PREVIEW_URL=//p' preview.log)"
          dev="$(sed -n 's/^PREVIEW_WORKERS_DEV_URL=//p' preview.log)"
          [ -n "$url" ] && [ -n "$dev" ] || { echo "::error::the preview printed no URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"

      # Linked at once on workers.dev: a new host's certificate takes a few minutes, and the
      # preview is usable before it.
      - name: Link the preview on the pull request
        env:
          URL: ${{ steps.deploy.outputs.url }}
          DEV: ${{ steps.deploy.outputs.dev }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scripts/preview-comment.sh "$PR" "$(printf '**Preview:** %s\n\n%s follows once its certificate is issued, usually within five minutes. Built from %s. Deleted when this pull request closes.' "$DEV" "$URL" "$SHA")"

      - name: Wait for the preview host
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node scripts/preview.mjs wait-host "$PR" "$BRANCH"

      - name: Link the preview host on the pull request
        env:
          URL: ${{ steps.deploy.outputs.url }}
          DEV: ${{ steps.deploy.outputs.dev }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scripts/preview-comment.sh "$PR" "$(printf '**Preview:** %s\n\nAlso at %s. Built from %s. Deleted when this pull request closes.' "$URL" "$DEV" "$SHA")"

  teardown:
    name: Delete preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete the preview
        run: node scripts/preview.mjs teardown "$PR"

      - name: Mark the comment
        run: scripts/preview-comment.sh "$PR" '**Preview:** deleted when this pull request closed.' --update-only
