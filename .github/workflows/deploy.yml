name: Deploy Production

# Production deploy. Every merge to `main` ships: when CI passes on a push to
# `main`, this deploys exactly the commit CI checked. A red CI run deploys
# nothing. The manual trigger stays for a redeploy (Actions tab, or
# `gh workflow run deploy.yml --ref main`), which builds the current `main`.
#
# Automatic deploys run only in webbertakken/livedoc, which holds docs.nu's
# secrets; a fork deploys by hand, or widens the guard below once its own
# secrets are set.
#
# The steps live in `deploy-reusable.yml`. This file is only the trigger and
# the production-shaped inputs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  # Never cancel a half-finished production deploy: some workers would hold
  # the new code and some the old. Queue behind the one in flight instead.
  cancel-in-progress: false

jobs:
  # CI on `main` runs once per commit and never cancels an older run, so with several
  # sessions merging, a commit's CI often finishes after the next merge. The newest green
  # commit deploys even when `main` has moved on; one that is the same as, or older than,
  # what production runs stands down, so production never goes back
  # (scripts/deploy-gate.mjs, docs/specs/016-platform/deployment.md). A pull request's CI
  # never deploys production.
  latest:
    name: Latest on main
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'webbertakken/livedoc' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.gate.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy-gate.mjs
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/deploy-gate.mjs

  deploy:
    name: Production
    needs: latest
    # A dispatch deploys on demand (the gate above is skipped then); a CI run
    # deploys only a commit the gate found newer than production.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.latest.outputs.current == 'true')
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      # The commit CI passed; empty on a dispatch, which takes the current `main`.
      ref: ${{ github.event.workflow_run.head_sha || '' }}
      # Empty: the top-level wrangler.toml config, docs.nu's workers and its
      # D1 / R2 / KV.
      wrangler_env: ''
      environment_name: production
      environment_url: https://docs.nu
      # docs.nu's own MCP host, so the live app never points at another
      # deployment's. The worker itself waits until docs.nu turns it on (deploy_mcp).
      mcp_origin: https://mcp.docs.nu
      deploy_mcp: false
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
      INTERNAL_EVENTS_KEY: ${{ secrets.INTERNAL_EVENTS_KEY }}
      NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
