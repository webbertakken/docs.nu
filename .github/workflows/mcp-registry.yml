name: Publish MCP server to registry

# Lists the hosted MCP server (mcp.docs.nu) in the official MCP
# Registry (registry.modelcontextprotocol.io) from the root server.json.
# PulseMCP and other directories ingest from that registry.
#
# Runs by hand only: mcp.docs.nu is not deployed yet (the MCP job is opt-in), and a
# listing must not point at an endpoint that does not answer. Restore the push
# trigger once it serves. The registry refuses a version it has already seen, so
# bump "version" in server.json to republish.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login for the io.github.webbertakken namespace
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
